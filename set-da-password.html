<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生成 da-auth-config.js（DA 工具箱）</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; line-height: 1.5; color: #1e293b; }
    h1 { font-size: 1.25rem; }
    label { display: block; margin-top: 14px; font-weight: 600; font-size: 14px; }
    input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; font-size: 15px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { margin-top: 16px; padding: 10px 18px; font-size: 15px; border-radius: 8px; border: 0; background: #0f766e; color: #fff; cursor: pointer; }
    button:hover { background: #115e59; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    textarea { width: 100%; box-sizing: border-box; margin-top: 10px; font-family: ui-monospace, monospace; font-size: 12px; min-height: 180px; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; }
    .warn { background: #fff7ed; border: 1px solid #fdba74; padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-top: 16px; }
    .err { color: #b91c1c; font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>生成访问密码配置 da-auth-config.js</h1>
  <p>在浏览器中输入站点密码，生成与 index.html 同目录的配置文件内容。保存为 da-auth-config.js 后部署或刷新即可（该文件已在 .gitignore，勿提交公开仓库）。</p>
  <div class="warn">
    校验在浏览器内完成，配置内存 PBKDF2 哈希；拿到文件仍可暴力破解弱口令，请使用足够长的随机密码。本方式不消耗 Netlify Functions 额度。
  </div>
  <label for="pw1">站点密码</label>
  <input type="password" id="pw1" autocomplete="new-password" minlength="4">
  <label for="pw2">再输入一次</label>
  <input type="password" id="pw2" autocomplete="new-password" minlength="4">
  <button type="button" id="btnGen">生成配置</button>
  <p id="msg" class="err" hidden></p>
  <label for="out">保存为与 index.html 同目录的 da-auth-config.js</label>
  <textarea id="out" readonly placeholder="点击「生成配置」后显示…"></textarea>
  <button type="button" id="btnDl" disabled>下载 da-auth-config.js</button>
  <script>
    (function () {
      var ITER = 100000;
      var pw1 = document.getElementById('pw1');
      var pw2 = document.getElementById('pw2');
      var btnGen = document.getElementById('btnGen');
      var btnDl = document.getElementById('btnDl');
      var out = document.getElementById('out');
      var msg = document.getElementById('msg');
      function showErr(t) {
        if (!t) { msg.hidden = true; msg.textContent = ''; return; }
        msg.hidden = false;
        msg.textContent = t;
      }
      function bytesToB64(buf) {
        var bin = '';
        buf.forEach(function (b) { bin += String.fromCharCode(b); });
        return btoa(bin);
      }
      function randSalt(len) {
        var a = new Uint8Array(len);
        crypto.getRandomValues(a);
        return a;
      }
      btnGen.addEventListener('click', function () {
        showErr('');
        out.value = '';
        btnDl.disabled = true;
        if (!window.crypto || !window.crypto.subtle) {
          showErr('当前环境不支持 Web Crypto（请使用 HTTPS 或 localhost 打开本页）。');
          return;
        }
        var a = String(pw1.value || '');
        var b = String(pw2.value || '');
        if (a.length < 4) { showErr('密码至少 4 位（建议更长、更随机）。'); return; }
        if (a !== b) { showErr('两次输入不一致。'); return; }
        var salt = randSalt(16);
        var saltB64 = bytesToB64(salt);
        var enc = new TextEncoder();
        crypto.subtle.importKey('raw', enc.encode(a), 'PBKDF2', false, ['deriveBits'])
          .then(function (keyMaterial) {
            return crypto.subtle.deriveBits(
              { name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: ITER },
              keyMaterial,
              256
            );
          })
          .then(function (bits) {
            var hashB64 = bytesToB64(new Uint8Array(bits));
            var body =
              '// 由 set-da-password.html 生成。勿提交到公开 Git 仓库。\n' +
              'window.__DA_AUTH_CONFIG__ = {\n' +
              '  v: 1,\n' +
              '  iterations: ' + ITER + ',\n' +
              '  saltB64: ' + JSON.stringify(saltB64) + ',\n' +
              '  hashB64: ' + JSON.stringify(hashB64) + '\n' +
              '};\n';
            out.value = body;
            btnDl.disabled = false;
          })
          .catch(function () {
            showErr('生成失败，请重试。');
          });
      });
      btnDl.addEventListener('click', function () {
        var t = out.value;
        if (!t) return;
        var blob = new Blob([t], { type: 'application/javascript;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'da-auth-config.js';
        a.click();
        URL.revokeObjectURL(a.href);
      });
    })();
  </script>
</body>
</html>
